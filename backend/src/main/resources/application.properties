spring.application.name=natacion-api
server.port=8080
server.error.include-message=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/natacion}
spring.datasource.username=${POSTGRES_USER:natacion}
spring.datasource.password=${POSTGRES_PASSWORD:natacion}

# Hibernate crea y actualiza las tablas. Si el modelo crece, conviene pasar a Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# El JSON de la API usa snake_case (nombre_completo, dia_pago, ...).
spring.jackson.property-naming-strategy=SNAKE_CASE

app.secret=${SECRET_KEY:dev-cambia-esta-clave}
app.token-horas=${TOKEN_HORAS:12}
app.admin.usuario=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
