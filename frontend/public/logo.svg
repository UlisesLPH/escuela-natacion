<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Burbujas · Centro acuático">
  <defs>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3cde4"/>
      <stop offset="1" stop-color="#4a729c"/>
    </linearGradient>
    <radialGradient id="burbuja" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#6fd0f7"/>
      <stop offset=".6" stop-color="#2fa6e6"/>
      <stop offset="1" stop-color="#1585cf"/>
    </radialGradient>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3d8ea"/>
      <stop offset=".55" stop-color="#7f9fc0"/>
      <stop offset="1" stop-color="#4a729c"/>
    </linearGradient>
    <clipPath id="dentro"><circle cx="100" cy="100" r="83"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="88" fill="#fff" stroke="url(#aro)" stroke-width="9"/>

  <g clip-path="url(#dentro)">
    <!-- burbujas detrás de la onda -->
    <circle cx="68" cy="84" r="25" fill="url(#burbuja)"/>
    <circle cx="61" cy="75" r="7" fill="#fff" opacity=".75"/>
    <circle cx="124" cy="48" r="12" fill="url(#burbuja)"/>
    <circle cx="128" cy="44" r="3.5" fill="#fff" opacity=".8"/>
    <circle cx="122" cy="112" r="43" fill="url(#burbuja)"/>
    <circle cx="135" cy="92" r="10" fill="#fff" opacity=".75"/>

    <!-- onda -->
    <path d="M4 96 C40 84 74 90 104 98 S160 100 196 82 L196 104 C160 120 128 116 100 112 S40 104 4 116 Z" fill="url(#onda)" opacity=".92"/>
    <path d="M4 90 C30 84 56 84 78 88 C56 88 30 90 4 98 Z" fill="#c3d8ea" opacity=".9"/>
    <path d="M118 150 C142 150 164 140 196 122 L196 130 C168 148 144 156 118 150 Z" fill="url(#onda)" opacity=".85"/>

    <!-- burbujas delante -->
    <circle cx="44" cy="122" r="7" fill="url(#burbuja)"/>
    <circle cx="46" cy="119" r="2" fill="#fff" opacity=".8"/>
    <circle cx="74" cy="138" r="15" fill="url(#burbuja)"/>
    <circle cx="78" cy="133" r="4.5" fill="#fff" opacity=".8"/>
    <circle cx="114" cy="132" r="5" fill="#fff" opacity=".7"/>
  </g>
</svg>
